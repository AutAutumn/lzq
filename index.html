<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>光之捕手 · 花信</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
:root {
    --glass-bg: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.2);
    --gold: #e8c57a;
    --text-main: #fff;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
body { font-family: 'Noto Serif SC', serif; background: #1a0f14; color: var(--text-main); }

#gameCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

.ui-layer { position: fixed; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: center; align-items: center; }
.ui-layer > * { pointer-events: auto; }

/* HUD 增强 */
.hud { position: absolute; top: 24px; left: 0; width: 100%; padding: 0 32px; display: flex; justify-content: space-between; align-items: flex-start; opacity: 0; transition: opacity 0.8s ease; }
.hud.visible { opacity: 1; }
.hud-left { display: flex; flex-direction: column; gap: 8px; }
.hud-target { font-size: 0.9rem; letter-spacing: 2px; color: rgba(255,255,255,0.8); }
.hud-progress { display: flex; gap: 6px; }
.hud-dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--gold); background: transparent; transition: all 0.4s ease; }
.hud-dot.filled { background: var(--gold); box-shadow: 0 0 8px var(--gold); transform: scale(1.2); }

/* 能量槽 */
.energy-bar-wrap { width: 120px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; margin-top: 4px; }
.energy-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--gold), #fff); transition: width 0.3s ease; }
.energy-hint { font-size: 0.65rem; color: var(--gold); opacity: 0; transition: opacity 0.3s; letter-spacing: 1px; margin-top: 2px; }
.energy-hint.ready { opacity: 1; animation: pulse 1.5s infinite; }

@keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

/* Combo 浮动文字 */
.combo-text {
    position: fixed; pointer-events: none; z-index: 8;
    font-family: 'ZCOOL XiaoWei', serif; font-size: 1.4rem;
    color: var(--gold); text-shadow: 0 0 10px rgba(232,197,122,0.5);
    animation: comboFloat 0.8s ease-out forwards;
}
@keyframes comboFloat {
    0% { opacity: 1; transform: translateY(0) scale(0.8); }
    100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
}

/* Glass Cards */
.glass-panel {
    background: var(--glass-bg);
    backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 48px 40px;
    text-align: center;
    max-width: 420px; width: 90%;
    position: relative; overflow: hidden;
    opacity: 0; transform: translateY(20px) scale(0.97);
    transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
}
.glass-panel.visible { opacity: 1; transform: translateY(0) scale(1); }
.glass-panel::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
}

.panel-tag { font-size: 0.75rem; letter-spacing: 5px; text-transform: uppercase; color: var(--gold); margin-bottom: 16px; }
.panel-title { font-family: 'ZCOOL XiaoWei', serif; font-size: 2rem; margin-bottom: 12px; line-height: 1.4; background: linear-gradient(135deg, #fff, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.panel-desc { font-size: 1rem; color: rgba(255,255,255,0.75); line-height: 1.8; font-weight: 300; margin-bottom: 28px; white-space: pre-line; }
.panel-poem { font-family: 'ZCOOL XiaoWei', serif; font-size: 1.3rem; line-height: 2.2; color: rgba(255,255,255,0.9); margin-bottom: 24px; white-space: pre-line; }
.panel-stats { font-size: 0.8rem; color: rgba(255,255,255,0.5); margin-bottom: 20px; letter-spacing: 1px; }

.btn {
    display: inline-block; padding: 14px 44px;
    border: 1px solid var(--gold); border-radius: 50px;
    color: var(--gold); text-decoration: none;
    font-size: 0.9rem; letter-spacing: 3px;
    background: rgba(232,197,122,0.06);
    cursor: pointer; transition: all 0.4s ease;
    position: relative; overflow: hidden;
}
.btn::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(232,197,122,0.2), rgba(255,183,197,0.15));
    transform: scaleX(0); transform-origin: left;
    transition: transform 0.4s ease; border-radius: 50px;
}
.btn:hover { color: #fff; border-color: #fff; box-shadow: 0 0 24px rgba(232,197,122,0.25); }
.btn:hover::before { transform: scaleX(1); }
.btn span { position: relative; z-index: 1; }

.ripple {
    position: fixed; pointer-events: none; z-index: 5;
    border-radius: 50%; border: 1px solid rgba(255,255,255,0.4);
    animation: rippleAnim 0.6s ease-out forwards;
}
@keyframes rippleAnim {
    0% { width: 0; height: 0; opacity: 1; }
    100% { width: 80px; height: 80px; opacity: 0; }
}

.hidden { display: none !important; }

@media (max-width: 480px) {
    .glass-panel { padding: 36px 28px; }
    .panel-title { font-size: 1.6rem; }
    .panel-poem { font-size: 1.1rem; }
    .hud { padding: 0 20px; }
}
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div class="ui-layer">
    <div class="hud" id="hud">
        <div class="hud-left">

<script>
/* =========================================
   AUDIO ENGINE - 程序化音频合成
   ========================================= */
class AudioEngine {
    constructor() {
        this.ctx = null;
        this.initialized = false;
        this.baseFreq = 440;
    }
    
    init() {
        if (this.initialized) return;
        try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.initialized = true;
            this.startAmbient();
        } catch(e) { console.warn('Audio not supported'); }
    }
    
    // 空灵风铃音效 - 音高随combo递增
    playCollect(comboLevel) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();
        
        // 五声音阶频率映射
        const scale = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66];
        const freq = scale[Math.min(comboLevel, scale.length - 1)];
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.5, this.ctx.currentTime + 0.1);
        
        filter.type = 'lowpass';
        filter.frequency.value = 2000;
        
        gain.gain.setValueAtTime(0, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.15, this.ctx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.8);
        
        osc.connect(filter).connect(gain).connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.8);
    }
    
    // 误触柔和反馈
    playMiss() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(200, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
    }
    
    // 时光停滞持续音效
    startSlowMo() {
        if (!this.ctx || this.slowMoOsc) return;
        this.slowMoOsc = this.ctx.createOscillator();
        this.slowMoGain = this.ctx.createGain();
        this.slowMoOsc.type = 'sine';
        this.slowMoOsc.frequency.value = 180;
        this.slowMoGain.gain.setValueAtTime(0, this.ctx.currentTime);
        this.slowMoGain.gain.linearRampToValueAtTime(0.06, this.ctx.currentTime + 0.3);
        this.slowMoOsc.connect(this.slowMoGain).connect(this.ctx.destination);
        this.slowMoOsc.start();
    }
    
    stopSlowMo() {
        if (!this.slowMoOsc) return;
        this.slowMoGain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3);
        this.slowMoOsc.stop(this.ctx.currentTime + 0.3);
        this.slowMoOsc = null;
        this.slowMoGain = null;
    }
    
    // 环境白噪音
    startAmbient() {
        if (!this.ctx) return;
        const bufferSize = this.ctx.sampleRate * 2;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.3;
        
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 400;
        const gain = this.ctx.createGain();
        gain.gain.value = 0.02;
        noise.connect(filter).connect(gain).connect(this.ctx.destination);
        noise.start();
    }
}

/* =========================================
   ROMANCE RNG
   ========================================= */
class RomanceRNG {
    constructor() { this.seed = Date.now() ^ (Math.random() * 0xFFFFFFFF >>> 0); }
    next() {
        let t = this.seed += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
    range(min, max) { return min + this.next() * (max - min); }
    int(min, max) { return Math.floor(this.range(min, max + 1)); }
    pick(arr) { return arr[this.int(0, arr.length - 1)]; }
}

/* =========================================

const THEMES = [

    { name: '薰衣草暮', skyTop: '#1a1040', skyMid: '#7b5ea7', skyBot: '#e8d5f0', petalColor: [200,170,220], glowColor: [220,200,255] },
    { name: '蜜桃星云', skyTop: '#3d1b2d', skyMid: '#c47a8a', skyBot: '#fff0e0', petalColor: [255,200,180], glowColor: [255,230,210] },
    { name: '薄荷月夜', skyTop: '#0a1628', skyMid: '#3a6b7a', skyBot: '#d0e8e0', petalColor: [180,220,210], glowColor: [200,255,240] },
    { name: '琥珀暖夕', skyTop: '#3d2a10', skyMid: '#b8863a', skyBot: '#fff5e0', petalColor: [240,210,160], glowColor: [255,240,200] },
    { name: '玫瑰晨曦', skyTop: '#2d1028', skyMid: '#c46080', skyBot: '#ffe0e8', petalColor: [255,170,190], glowColor: [255,210,220] },
];

    "风记得你来过，这就够了",
    "不必追赶所有美好，你本身就是风景",
];

const COMBO_WORDS = ['✦', '✦✦', '✦✦✦', '花雨', '星河', '永恒'];

/* =========================================
   PERSISTENCE
   ========================================= */
class SaveManager {
    static load() {
        try { return JSON.parse(localStorage.getItem('hanabi_save')) || { bestCombo: 0, poemsUnlocked: [] }; }
        catch { return { bestCombo: 0, poemsUnlocked: [] }; }
    }
    static save(data) {
        try { localStorage.setItem('hanabi_save', JSON.stringify(data)); } catch {}
    }
    static recordPoem(poem) {
        const data = this.load();
        if (!data.poemsUnlocked.includes(poem)) {
            data.poemsUnlocked.push(poem);
            this.save(data);
        }
    }
    static updateBestCombo(combo) {
        const data = this.load();
        if (combo > data.bestCombo) { data.bestCombo = combo; this.save(data); }
    }
}

/* =========================================
   CANVAS RENDERER
   ========================================= */
class GameRenderer {
    constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.entities = [];
        this.particles = [];
        this.trail = [];
        this.dpr = window.devicePixelRatio || 1;
        this.width = 0; this.height = 0;
        this.theme = null;
        this.mouseX = -100; this.mouseY = -100;
        this.resize();
        window.addEventListener('resize', () => this.resize());
    }
    
    resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width * this.dpr;
        this.canvas.height = this.height * this.dpr;
        this.canvas.style.width = this.width + 'px';
        this.canvas.style.height = this.height + 'px';
        this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    }
    
    setTheme(theme) { this.theme = theme; }
    
    drawBackground(timeScale) {
        if (!this.theme) return;
        const grad = this.ctx.createLinearGradient(0, 0, 0, this.height);
        grad.addColorStop(0, this.theme.skyTop);
        grad.addColorStop(0.5, this.theme.skyMid);
        grad.addColorStop(1, this.theme.skyBot);
        this.ctx.fillStyle = grad;
        this.ctx.fillRect(0, 0, this.width, this.height);
        
        const sunGrad = this.ctx.createRadialGradient(this.width * 0.5, this.height * 0.18, 0, this.width * 0.5, this.height * 0.18, this.width * 0.35);
        sunGrad.addColorStop(0, `rgba(${this.theme.glowColor.join(',')}, ${0.3 * timeScale})`);
        sunGrad.addColorStop(0.5, `rgba(${this.theme.glowColor.join(',')}, 0.08)`);
        sunGrad.addColorStop(1, 'transparent');
        this.ctx.fillStyle = sunGrad;
        this.ctx.fillRect(0, 0, this.width, this.height);
        
        // Slow-mo vignette overlay
        if (timeScale < 0.9) {
            const vig = this.ctx.createRadialGradient(this.width/2, this.height/2, this.height*0.3, this.width/2, this.height/2, this.height*0.8);
            vig.addColorStop(0, 'transparent');
            vig.addColorStop(1, `rgba(0,0,0,${0.3 * (1 - timeScale)})`);
            this.ctx.fillStyle = vig;
            this.ctx.fillRect(0, 0, this.width, this.height);
        }
    }
    
    spawnEntity(type) {
        const size = 12 + Math.random() * 16;
        const x = Math.random() * this.width;
        this.entities.push({
            type, x, y: -30, baseX: x, size,
            speed: 0.5 + Math.random() * 1.2,
            swayAmp: 30 + Math.random() * 60,
            swayFreq: 0.005 + Math.random() * 0.01,
            phase: Math.random() * Math.PI * 2,
            opacity: 0, maxOpacity: 0.6 + Math.random() * 0.4,
            rotation: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.03,
            alive: true, collected: false
        });
    }
    
    spawnBurst(x, y, color, count = 15) {
        for (let i = 0; i < count; i++) {
            const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
            const speed = 1.5 + Math.random() * 4;
            this.particles.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 1,
                gravity: 0.05, friction: 0.97,
                life: 1, decay: 0.012 + Math.random() * 0.015,
                size: 2 + Math.random() * 4, color
            });
        }
    }
    
    addTrailPoint(x, y) {
        this.trail.push({ x, y, life: 1 });
        if (this.trail.length > 20) this.trail.shift();
    }
    
    update(dt, timeScale) {
        const ts = timeScale; // Time scale multiplier
        
        for (let e of this.entities) {
            if (!e.alive) continue;
            e.y += e.speed * dt * 0.06 * ts;
            e.x = e.baseX + Math.sin(e.y * e.swayFreq + e.phase) * e.swayAmp;
            e.rotation += e.rotSpeed * dt * 0.06 * ts;
            if (e.y < 50) e.opacity = Math.min(e.maxOpacity, e.opacity + 0.02 * dt * 0.06);
            if (e.y > this.height - 50) e.opacity = Math.max(0, e.opacity - 0.03 * dt * 0.06);
            if (e.y > this.height + 40) e.alive = false;
        }
        this.entities = this.entities.filter(e => e.alive);
        
        for (let p of this.particles) {
            p.vx *= p.friction; p.vy *= p.friction;
            p.vy += p.gravity * ts;
            p.x += p.vx * dt * 0.06 * ts;
            p.y += p.vy * dt * 0.06 * ts;
            p.life -= p.decay * dt * 0.06;
        }
        this.particles = this.particles.filter(p => p.life > 0);
        
        // Trail decay
        for (let t of this.trail) t.life -= 0.05 * dt * 0.06;
        this.trail = this.trail.filter(t => t.life > 0);
    }
    
    draw() {
        this.drawBackground(1);
        const ctx = this.ctx;
        
        // Draw trail
        if (this.trail.length > 1 && this.theme) {
            ctx.save();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            for (let i = 1; i < this.trail.length; i++) {
                const t0 = this.trail[i-1], t1 = this.trail[i];
                ctx.beginPath();
                ctx.moveTo(t0.x, t0.y);
                ctx.lineTo(t1.x, t1.y);
                ctx.strokeStyle = `rgba(${this.theme.glowColor.join(',')},${t1.life * 0.4})`;
                ctx.lineWidth = t1.life * 6;
                ctx.stroke();
            }
            ctx.restore();
        }
        
        for (let e of this.entities) {
            if (!e.alive || e.collected) continue;
            ctx.save();
            ctx.translate(e.x, e.y);
            ctx.rotate(e.rotation);
            ctx.globalAlpha = e.opacity;
            const [r, g, b] = this.theme.petalColor;
            
            if (e.type === 'glow') {
                const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, e.size);
                grad.addColorStop(0, `rgba(${this.theme.glowColor.join(',')}, 0.9)`);
                grad.addColorStop(0.5, `rgba(${this.theme.glowColor.join(',')}, 0.3)`);
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.beginPath(); ctx.arc(0, 0, e.size, 0, Math.PI * 2); ctx.fill();
            } else if (e.type === 'petal') {
                ctx.fillStyle = `rgba(${r},${g},${b},0.85)`;
                ctx.shadowColor = `rgba(${r},${g},${b},0.5)`; ctx.shadowBlur = 8;
                ctx.beginPath(); ctx.ellipse(0, 0, e.size * 0.6, e.size, 0, 0, Math.PI * 2); ctx.fill();
            } else if (e.type === 'star') {
                ctx.fillStyle = 'rgba(255,255,240,0.9)';
                ctx.shadowColor = 'rgba(255,255,240,0.6)'; ctx.shadowBlur = 12;
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const a = (Math.PI * 2 / 5) * i - Math.PI / 2;
                    const ox = Math.cos(a) * e.size * 0.7, oy = Math.sin(a) * e.size * 0.7;
                    const ia = a + Math.PI / 5;
                    const ix = Math.cos(ia) * e.size * 0.3, iy = Math.sin(ia) * e.size * 0.3;
                    if (i === 0) ctx.moveTo(ox, oy); else ctx.lineTo(ox, oy);
                    ctx.lineTo(ix, iy);
                }
                ctx.closePath(); ctx.fill();
            }
            ctx.restore();
        }
        
        for (let p of this.particles) {
            ctx.save();
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }
    }
    
    getHitEntity(x, y, radius = 45) {
        for (let e of this.entities) {
            if (!e.alive || e.collected) continue;
            const dx = e.x - x, dy = e.y - y;
            if (dx * dx + dy * dy < (radius + e.size) ** 2) return e;
        }
        return null;
    }
}

/* =========================================
   GAME CONTROLLER
   ========================================= */
class GameController {
    constructor() {
        this.rng = new RomanceRNG();
        this.audio = new AudioEngine();
        this.renderer = new GameRenderer(document.getElementById('gameCanvas'));
        this.state = 'START';
        this.targetCount = 0;
        this.collected = 0;
        this.combo = 0;
        this.maxCombo = 0;
        this.energy = 0; // 0~100
        this.timeScale = 1;
        this.isSlowMo = false;
        this.currentTheme = null;
        this.currentTargetType = null;
        this.spawnTimer = 0;
        this.lastTime = performance.now();
        this.pointerDown = false;
        
        this.startPanel = document.getElementById('startPanel');
        this.resultPanel = document.getElementById('resultPanel');
        this.hud = document.getElementById('hud');
        this.hudTarget = document.getElementById('hudTarget');
        this.hudProgress = document.getElementById('hudProgress');
        this.energyBar = document.getElementById('energyBar');
        this.energyHint = document.getElementById('energyHint');
        
        this.bindEvents();
        this.initRound();
        this.loop();
    }
    
    initRound() {
        this.rng = new RomanceRNG();
        this.currentTheme = this.rng.pick(THEMES);
        this.renderer.setTheme(this.currentTheme);
        this.currentTargetType = this.rng.pick(TARGET_TYPES);
        this.targetCount = this.rng.int(3, 5);
        this.collected = 0;
        this.combo = 0;
        this.maxCombo = 0;
        this.energy = 0;
        this.updateEnergyUI();
        
        document.getElementById('startTitle').textContent = this.currentTheme.name;
        document.getElementById('startDesc').textContent = 
            `在这片${this.currentTheme.name}中，\n请为我收集 ${this.targetCount} 颗${this.currentTargetType.name} ${this.currentTargetType.emoji}\n\n✦ 连续收集积攒能量\n✦ 长按屏幕可停滞时光`;
    }
    
    startGame() {
        this.audio.init();
        this.state = 'PLAYING';
        this.startPanel.classList.remove('visible');
        setTimeout(() => {
            this.startPanel.classList.add('hidden');
            this.hud.classList.add('visible');
            this.updateHUD();
        }, 400);
    }
    
    endGame(completed) {
        this.state = 'RESULT';
        this.hud.classList.remove('visible');
        if (this.isSlowMo) this.stopSlowMo();
        
        SaveManager.updateBestCombo(this.maxCombo);
        const poem = this.rng.pick(POEMS);
        if (completed) SaveManager.recordPoem(poem);
        
        const saveData = SaveManager.load();
        
        setTimeout(() => {
            this.resultPanel.classList.remove('hidden');
            requestAnimationFrame(() => this.resultPanel.classList.add('visible'));
            
            document.getElementById('resultPoem').textContent = poem;
            document.getElementById('resultStats').textContent = 
                `最高连击 ${this.maxCombo} · 已解锁 ${saveData.poemsUnlocked.length}/${POEMS.length} 首花签`;
            document.getElementById('resultDesc').textContent = 
                completed 
                    ? `你集齐了所有${this.currentTargetType.name}，花签已为你绽放。` 
                    : this.rng.pick(ENCOURAGEMENTS);
        }, 600);
    }
    
    replay() {
        this.resultPanel.classList.remove('visible');
        setTimeout(() => {
            this.resultPanel.classList.add('hidden');
            this.renderer.entities = [];
            this.renderer.particles = [];
            this.renderer.trail = [];
            this.initRound();
            this.startPanel.classList.remove('hidden');
            requestAnimationFrame(() => this.startPanel.classList.add('visible'));
            this.state = 'START';
        }, 500);
    }
    
    updateHUD() {
        this.hudTarget.textContent = `${this.currentTargetType.emoji} ${this.currentTargetType.name}  ${this.collected} / ${this.targetCount}`;
        this.hudProgress.innerHTML = '';
        for (let i = 0; i < this.targetCount; i++) {
            const dot = document.createElement('div');
            dot.className = 'hud-dot' + (i < this.collected ? ' filled' : '');
            this.hudProgress.appendChild(dot);
        }
    }
    
    updateEnergyUI() {
        this.energyBar.style.width = this.energy + '%';
        if (this.energy >= 100) {
            this.energyHint.classList.add('ready');
        } else {
            this.energyHint.classList.remove('ready');
        }
    }
    
    startSlowMo() {
        if (this.energy < 100 || this.isSlowMo) return;
        this.isSlowMo = true;
        this.timeScale = 0.2;
        this.audio.startSlowMo();
    }
    
    stopSlowMo() {
        if (!this.isSlowMo) return;
        this.isSlowMo = false;
        this.timeScale = 1;
        this.energy = 0;
        this.updateEnergyUI();
        this.audio.stopSlowMo();
    }
    
    showComboText(x, y, combo) {
        const word = COMBO_WORDS[Math.min(Math.floor(combo / 3), COMBO_WORDS.length - 1)];
        if (combo < 2 && word === '✦') return;
        const el = document.createElement('div');
        el.className = 'combo-text';
        el.textContent = word;
        el.style.left = x + 'px';
        el.style.top = (y - 30) + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 800);
    }
    
    handleInput(x, y) {
        if (this.state !== 'PLAYING') return;
        
        this.renderer.addTrailPoint(x, y);
        
        const hit = this.renderer.getHitEntity(x, y);
        if (hit && hit.type === this.currentTargetType.type) {
            hit.collected = true;
            hit.alive = false;
            this.collected++;
            this.combo++;
            this.maxCombo = Math.max(this.maxCombo, this.combo);
            this.energy = Math.min(100, this.energy + 20);
            this.updateEnergyUI();
            this.updateHUD();
            
            const [r, g, b] = this.renderer.theme.glowColor;
            this.renderer.spawnBurst(hit.x, hit.y, `rgba(${r},${g},${b},0.9)`);
            this.audio.playCollect(this.combo);
            this.showComboText(x, y, this.combo);
            
            if (this.collected >= this.targetCount) {
                setTimeout(() => this.endGame(true), 800);
            }
        } else {
            this.combo = 0;
            this.showRipple(x, y);
            this.audio.playMiss();
        }
    }
    
    showRipple(x, y) {
        const ripple = document.createElement('div');
        ripple.className = 'ripple';
        ripple.style.left = (x - 40) + 'px';
        ripple.style.top = (y - 40) + 'px';
        document.body.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
    }
    
    bindEvents() {
        document.getElementById('startBtn').addEventListener('click', () => this.startGame());
        document.getElementById('replayBtn').addEventListener('click', () => this.replay());
        
        const canvas = this.renderer.canvas;
        
        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            this.pointerDown = true;
            const x = e.clientX, y = e.clientY;
            this.handleInput(x, y);
            // Check slow-mo activation
            if (this.state === 'PLAYING' && this.energy >= 100) {
                this.startSlowMo();
            }
        }, { passive: false });
        
        canvas.addEventListener('pointermove', (e) => {
            e.preventDefault();
            this.renderer.mouseX = e.clientX;
            this.renderer.mouseY = e.clientY;
            if (this.state === 'PLAYING') {
                this.renderer.addTrailPoint(e.clientX, e.clientY);
            }
        }, { passive: false });
        
        const releasePointer = () => {
            this.pointerDown = false;
            if (this.isSlowMo) this.stopSlowMo();
        };
        canvas.addEventListener('pointerup', releasePointer);
        canvas.addEventListener('pointerleave', releasePointer);
        canvas.addEventListener('pointercancel', releasePointer);
    }
    
    loop() {
        const now = performance.now();
        const rawDt = Math.min(now - this.lastTime, 50);
        this.lastTime = now;
        
        // Smooth time scale transition
        const targetTs = this.isSlowMo ? 0.2 : 1;
        this.timeScale += (targetTs - this.timeScale) * 0.1;
        
        if (this.state === 'PLAYING') {
            this.spawnTimer += rawDt;
            const spawnInterval = Math.max(300, 800 - this.renderer.width * 0.2);
            if (this.spawnTimer > spawnInterval) {
                this.spawnTimer = 0;
                const type = this.rng.next() < 0.6 
                    ? this.currentTargetType.type 
                    : this.rng.pick(TARGET_TYPES).type;
                this.renderer.spawnEntity(type);
            }
        } else {
            this.spawnTimer += rawDt;
            if (this.spawnTimer > 1200) {
                this.spawnTimer = 0;
                this.renderer.spawnEntity(this.rng.pick(TARGET_TYPES).type);
            }
        }
        
        this.renderer.update(rawDt, this.timeScale);
        this.renderer.draw();
        requestAnimationFrame(() => this.loop());
    }
}

window.addEventListener('DOMContentLoaded', () => new GameController());
</script>
